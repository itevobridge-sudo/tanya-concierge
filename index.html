                                "A'Zambezi River Lodge est situé sur les rives du fleuve Zambèze, en bordure du parc national du Zambèze, à proximité de Victoria Falls. Le site offre un accès direct au fleuve, une jetée et des vues sur la faune africaine, apprécié pour sa tranquillité et son isolement."

                            de: [
                                "Die A'Zambezi River Lodge liegt am Ufer des Sambesi, am Rand des Zambezi-Nationalparks, in der Nähe der Victoriafälle. Der Standort bietet Flussfront, einen Steg und Ausblicke auf die afrikanische Tierwelt und ist für seine Ruhe und Abgeschiedenheit bekannt."

                            zh: [

            render();

        // Works out the next scheduled shuttle departure relative to right
        // now, and how long until it leaves. Rolls over to tomorrow's first
        // departure once the day's last shuttle has gone.
        function getNextShuttle(schedule, lang) {
            const t = UI_TEXT[lang] || UI_TEXT.en;
            const toMinutes = (hhmm) => {
                const [h, m] = hhmm.split(':').map(Number);
                return h * 60 + m;
            };
            const now = new Date();
            const nowMinutes = now.getHours() * 60 + now.getMinutes();
            const sorted = schedule
                .map(s => ({ time: s.toRainforest, mins: toMinutes(s.toRainforest) }))
                .sort((a, b) => a.mins - b.mins);

            let next = sorted.find(s => s.mins > nowMinutes);
            let isTomorrow = false;
            if (!next) { next = sorted[0]; isTomorrow = true; }

            let diff = next.mins - nowMinutes;
            if (isTomorrow) diff += 24 * 60;

            let countdown;
            if (diff <= 0) {
                countdown = t.departingNow;
            } else {
                const h = Math.floor(diff / 60);
                const m = diff % 60;
                const timePart = h > 0 ? `${h}h ${m}m` : `${m} ${t.minAbbrev}`;
                if (lang === 'fr') countdown = `dans ${timePart}`;
                else if (lang === 'zh') countdown = `${timePart}后`;
                else countdown = `in ${timePart}`; // en, de both read naturally with "in"
            }

            return { time: next.time, isTomorrow, countdown };
        }

                `).join('');

            } else if (state.detailModal === 'menu') {
                title = CONFIG.restaurant.name;
                const cats = CONFIG.restaurant.categories;
                const active = cats.find(c => c.id === state.activeMenuTab) || cats[0];
                body = `
                    ${CONFIG.restaurant.bannerImage ? `
                        <div class="w-full h-40 overflow-hidden bg-slate-100 rounded-3xl shadow-sm mb-4">
                            <img src="${CONFIG.restaurant.bannerImage}" onload="handleImageLoad(this)" onerror="handleImageError(this)" class="w-full h-full object-cover" />
                        </div>
                    ` : ''}
                    <div class="sticky -top-6 -mx-6 px-6 pt-1 pb-3 bg-slate-50/95 backdrop-blur z-10 mb-4">
                        <div class="flex space-x-2 overflow-x-auto tab-scroll pb-1">
                            ${cats.map(c => `
                                <button onclick="setMenuTab('${c.id}')" class="flex-shrink-0 px-4 py-2 rounded-full text-xs font-bold border transition-all ${c.id === active.id ? 'bg-lodge-teal text-white border-lodge-teal' : 'bg-white text-slate-500 border-slate-200'}">
                                    ${L(c.label)}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                    ${active.note ? `<p class="text-xs text-slate-400 italic px-1 mb-3">${L(active.note)}</p>` : ''}
                    <div class="space-y-3">
                        ${active.items.map(item => `
                            <button onclick="window.open('${waLink(t.orderMsgPrefix + item.name)}')" class="w-full text-left flex items-start bg-white p-5 rounded-3xl border border-slate-100 shadow-sm active:bg-slate-50 transition-colors">
                                ${item.img ? `
                                    <div class="w-14 h-14 rounded-2xl overflow-hidden bg-slate-100 flex-shrink-0 mr-4">
                                        <img src="${item.img}" onload="handleImageLoad(this)" onerror="handleImageError(this)" class="w-full h-full object-cover" />
                                    </div>
                                ` : ''}
                                <div class="pr-4 flex-1">
                                    <h4 class="font-bold text-slate-800 text-sm">${item.name}</h4>
                                    ${item.desc ? `<p class="text-[11px] text-slate-400 mt-1 leading-relaxed">${item.desc}</p>` : ''}
                                </div>
                                <span class="font-black text-lodge-teal text-sm flex-shrink-0">${item.price}</span>
                            </button>
                        `).join('')}
                    </div>
                    <p class="text-[10px] text-slate-400 italic px-1 pt-6">${L(CONFIG.restaurant.allergyNote)}</p>
                `;

            } else if (state.detailModal === 'activities') {
                title = t.localAttractions;
                const act = CONFIG.activities;
                const cats = act.categories;
                const active = cats.find(c => c.id === state.activeActivityTab) || cats[0];
                const list = act.items.filter(item => item.category === active.id);

                body = `
                    ${act.bannerImage ? `
                        <div class="w-full h-40 overflow-hidden bg-slate-100 rounded-3xl shadow-sm mb-4">
                            <img src="${act.bannerImage}" onload="handleImageLoad(this)" onerror="handleImageError(this)" class="w-full h-full object-cover" />
                        </div>
                    ` : ''}
                    <div class="mb-4 p-4 bg-sky-50 rounded-2xl border border-sky-100 text-center">
                        <p class="text-[10px] font-bold text-lodge-teal uppercase tracking-widest">${act.provider}</p>
                        <p class="text-xs text-slate-500 italic">${L(act.tagline)}</p>
                    </div>
                    <div class="sticky -top-6 -mx-6 px-6 pt-1 pb-3 bg-slate-50/95 backdrop-blur z-10 mb-4">
                        <div class="flex space-x-2 overflow-x-auto tab-scroll pb-1">
                            ${cats.map(c => `
                                <button onclick="setActivityTab('${c.id}')" class="flex-shrink-0 px-4 py-2 rounded-full text-xs font-bold border transition-all ${c.id === active.id ? 'bg-lodge-teal text-white border-lodge-teal' : 'bg-white text-slate-500 border-slate-200'}">
                                    ${L(c.label)}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                    <div class="bg-white rounded-[32px] border border-slate-100 overflow-hidden shadow-sm">
                        ${list.length ? list.map(item => `
                            <button onclick="window.open('${item.url}', '_blank')" class="w-full text-left flex items-center justify-between p-5 border-b last:border-0 border-slate-100 active:bg-slate-50 transition-colors">
                                <div class="pr-3">
                                    <h4 class="font-bold text-slate-800 text-sm">${item.name}</h4>
                                    ${item.duration ? `<p class="text-[11px] text-slate-400 mt-0.5">${item.duration}</p>` : ''}
                                </div>
                                <div class="text-right flex-shrink-0 flex items-center space-x-2">
                                    <span class="font-black text-lodge-teal text-sm">${item.price}</span>
                                    <i data-lucide="chevron-right" class="text-slate-300" size="16"></i>
                                </div>
                            </button>
                        `).join('') : `<p class="p-6 text-sm text-slate-400 text-center">${t.nothingInCategory}</p>`}
                    </div>
                    <p class="text-[10px] text-slate-400 italic px-1 pt-4">${L(act.note)}</p>
                    <button onclick="window.open('${waLink(t.bookActivityMsg)}')" class="w-full mt-6 py-5 bg-lodge-teal text-white rounded-3xl font-black shadow-lg shadow-sky-50 active:scale-95 transition-all">${t.bookOnWhatsApp}</button>
                `;

            } else if (state.detailModal === 'shuttle') {
                title = t.shuttle;
                const s = CONFIG.shuttle;
                body = `
                    <div class="space-y-6">
                        ${s.bannerImage ? `
                            <div class="w-full h-40 overflow-hidden bg-slate-100 rounded-3xl shadow-sm">
                                <img src="${s.bannerImage}" onload="handleImageLoad(this)" onerror="handleImageError(this)" class="w-full h-full object-cover" />
                            </div>
                        ` : ''}
                        <div class="p-4 bg-slate-100 text-slate-600 text-xs rounded-2xl border border-slate-200">
                            <strong>${t.busRouteLabel}</strong> ${s.route.join(' ➔ ')}
                        </div>
                        <div class="bg-white rounded-[32px] border border-slate-100 overflow-hidden shadow-sm">
                            <div class="flex items-center justify-between px-5 py-3 bg-slate-50 border-b border-slate-100">
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${t.toRainforestLabel}</span>
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${t.fromRainforestLabel}</span>
                            </div>
                            ${s.schedule.map(item => `
                                <div class="flex items-center justify-between p-5 border-b last:border-0 border-slate-100">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-2.5 h-2.5 bg-lodge-teal rounded-full shadow-sm"></div>
                                        <span class="font-bold text-slate-800 text-sm">${item.toRainforest}</span>
                                    </div>
                                    <span class="font-bold text-slate-500 text-sm">${item.fromRainforest}</span>
                                </div>
                            `).join('')}
                        </div>
                        ${(L(s.notes) || []).map(n => `<p class="text-[11px] text-slate-400 px-2 italic">* ${n}</p>`).join('')}
                        <button onclick="window.open('${waLink(t.bookPrivateShuttleMsg)}')" class="w-full py-5 bg-lodge-teal text-white rounded-3xl font-black shadow-lg shadow-sky-50 active:scale-95 transition-all">${t.bookPrivateTaxiBtn}</button>
                    </div>
                `;

            } else if (state.detailModal === 'departments') {
                title = t.deptDirectory;
                body = `
                    <div class="bg-white rounded-[32px] border border-slate-100 overflow-hidden shadow-sm">
                        ${CONFIG.departments.map(item => `
                            <div class="flex items-center justify-between p-5 border-b last:border-0 border-slate-100">
                                <span class="font-bold text-slate-700 text-sm">${L(item.name)}</span>
                                <div class="flex items-center space-x-3 bg-slate-50 px-4 py-2.5 rounded-2xl border border-slate-100">
                                    <i data-lucide="phone" class="text-lodge-teal" size="14"></i>
                                    <span class="font-mono font-black text-lodge-teal text-sm">${item.ext}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            return `
                <div class="fixed inset-0 z-[200] bg-white flex flex-col animate-slide-up">
                    <div class="p-6 flex items-center justify-between border-b border-slate-100 bg-white sticky top-0 z-[210]">
                        <div class="flex items-center space-x-4">
                            <button onclick="setDetailModal(null)" class="p-2 -ml-2 rounded-full active:bg-slate-50 transition-colors">
                                <i data-lucide="chevron-left" size="24" class="text-lodge-teal"></i>
                            </button>
                            <h2 class="text-xl font-bold text-slate-800">${title}</h2>
                        </div>
                        <button onclick="setDetailModal(null)" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${t.close}</button>
                    </div>
                    <div class="flex-1 overflow-y-auto p-6 bg-slate-50/50">
                        ${body}
                    </div>
                </div>
            `;
        }

        function render() {
            let html = '';
            switch (state.view) {
                case 'loading': html = renderLoading(); break;
                case 'language': html = renderLanguage(); break;
                case 'landing':  html = renderLanding(); break;
                case 'capture':  html = renderCapture(); break;
                case 'wifi':     html = renderWifi(); break;
                case 'portal':   html = renderPortal(); break;
                default:         html = renderLoading(); break;
            }
            appContainer.innerHTML = html;
            lucide.createIcons();
        }

        async function loadConfig() {
            try {
                const res = await fetch('./config.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('config.json not reachable');
                CONFIG = await res.json();
            } catch (err) {
                console.warn('Falling back to built-in content:', err.message);
                CONFIG = DEFAULT_CONFIG;
                configError = true;
            }
            state.view = 'language';
            render();
        }

        window.onload = loadConfig;
    </script>
</body>
</html>
