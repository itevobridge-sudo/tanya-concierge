        :root {
            --lodge-teal: #00b5e2;
            --lodge-grey: #58595b;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 1s linear infinite;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
        }
        .bg-lodge-teal { background-color: var(--lodge-teal); }
        .text-lodge-teal { color: var(--lodge-teal); }
        .border-lodge-teal { border-color: var(--lodge-teal); }

        img { opacity: 0; transition: opacity 0.3s ease-in; }
        img.loaded { opacity: 1; }

        input { font-size: 16px !important; }

        .tab-scroll::-webkit-scrollbar { display: none; }
        .tab-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

            img.style.display = 'none';

            const icon = document.createElement('div');
            icon.innerHTML = '<i data-lucide="image-off" class="text-slate-300"></i>';

            lucide.createIcons();

            state.guestName = document.getElementById('guest-name-input').value;
            state.guestContact = document.getElementById('guest-contact-input').value;

            if (state.guestName.trim() && state.guestContact.trim()) {
                btn.disabled = false;
                btn.className = "w-full py-5 rounded-2xl font-bold mt-4 transition-all bg-lodge-teal text-white shadow-lg active:scale-95";
            } else {

                btn.className = "w-full py-5 rounded-2xl font-bold mt-4 transition-all bg-slate-200 text-slate-400 cursor-not-allowed";

        function copyToClipboard() {
            const pass = CONFIG.wifi.password;
            const textArea = document.createElement("textarea");
            textArea.value = pass;
            document.body.appendChild(textArea);
            textArea.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(textArea);
            state.copyStatus = true; render();
            setTimeout(() => { state.copyStatus = false; render(); }, 2000);

                                <button onclick="setActivityTab('${tab.id}')" class="flex-shrink-0 px-4 py-2 rounded-full text-xs font-bold border transition-all ${tab.id === activeId ? 'bg-lodge-teal text-white border-lodge-teal' : 'bg-white text-slate-500 border-slate-200'}">
                                    ${tab.label}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                    ${hasDesc ? `
                        <div class="space-y-4">
                            ${list.map(item => `
                                <div class="bg-white rounded-3xl border border-slate-100 overflow-hidden shadow-sm">
                                    ${item.img ? `
                                        <div class="w-full h-36 overflow-hidden bg-slate-100">
                                            <img src="${item.img}" onload="handleImageLoad(this)" onerror="handleImageError(this)" class="w-full h-full object-cover" />
                                        </div>
                                    ` : ''}
                                    <div class="p-6">
                                        <div class="flex justify-between items-start mb-2 gap-3">
                                            <h4 class="font-bold text-slate-800 text-sm">${item.name}</h4>
                                            <span class="text-[10px] bg-sky-50 text-lodge-teal px-3 py-1 rounded-full font-bold uppercase tracking-wider flex-shrink-0">${item.price}</span>
                                        </div>
                                        <p class="text-xs text-slate-500 leading-relaxed mb-1">${item.desc}</p>
                                        <p class="text-[10px] text-slate-400 italic">${item.note}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        ${sectionImg ? `
                            <div class="w-full h-36 overflow-hidden bg-slate-100 rounded-3xl shadow-sm mb-4">
                                <img src="${sectionImg}" onload="handleImageLoad(this)" onerror="handleImageError(this)" class="w-full h-full object-cover" />
                            </div>
                        ` : ''}
                        <div class="bg-white rounded-[32px] border border-slate-100 overflow-hidden shadow-sm">
                            ${list.map(item => priceRow(item, noteKey)).join('')}
                        </div>
                    `}
                    <button onclick="window.open('${waLink('Hello! I would like to book: ')}')" class="w-full mt-6 py-5 bg-lodge-teal text-white rounded-3xl font-black shadow-lg shadow-sky-50 active:scale-95 transition-all">${t.bookOnWhatsApp}</button>
                `;

            } else if (state.detailModal === 'shuttle') {
                title = t.shuttle;
                const s = CONFIG.shuttle;
                body = `
                    <div class="space-y-6">
                        ${s.bannerImage ? `
                            <div class="w-full h-40 overflow-hidden bg-slate-100 rounded-3xl shadow-sm">
                                <img src="${s.bannerImage}" onload="handleImageLoad(this)" onerror="handleImageError(this)" class="w-full h-full object-cover" />
                            </div>
                        ` : ''}
                        <div class="p-4 bg-slate-100 text-slate-600 text-xs rounded-2xl border border-slate-200">
                            <strong>Bus Route:</strong> ${s.route.join(' ➔ ')}
                        </div>
                        <div class="bg-white rounded-[32px] border border-slate-100 overflow-hidden shadow-sm">
                            <div class="flex items-center justify-between px-5 py-3 bg-slate-50 border-b border-slate-100">
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">To Rainforest</span>
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">From Rainforest</span>
                            </div>
                            ${s.schedule.map(item => `
                                <div class="flex items-center justify-between p-5 border-b last:border-0 border-slate-100">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-2.5 h-2.5 bg-lodge-teal rounded-full shadow-sm"></div>
                                        <span class="font-bold text-slate-800 text-sm">${item.toRainforest}</span>
                                    </div>
                                    <span class="font-bold text-slate-500 text-sm">${item.fromRainforest}</span>
                                </div>
                            `).join('')}
                        </div>
                        ${s.notes.map(n => `<p class="text-[11px] text-slate-400 px-2 italic">* ${n}</p>`).join('')}
                        <button onclick="window.open('${waLink('Book Private Shuttle')}')" class="w-full py-5 bg-lodge-teal text-white rounded-3xl font-black shadow-lg shadow-sky-50 active:scale-95 transition-all">Book Private Taxi</button>
                    </div>
                `;

            } else if (state.detailModal === 'departments') {
                title = t.deptDirectory;
                body = `
                    <div class="bg-white rounded-[32px] border border-slate-100 overflow-hidden shadow-sm">
                        ${CONFIG.departments.map(item => `
                            <div class="flex items-center justify-between p-5 border-b last:border-0 border-slate-100">
                                <span class="font-bold text-slate-700 text-sm">${item.name}</span>
                                <div class="flex items-center space-x-3 bg-slate-50 px-4 py-2.5 rounded-2xl border border-slate-100">
                                    <i data-lucide="phone" class="text-lodge-teal" size="14"></i>
                                    <span class="font-mono font-black text-lodge-teal text-sm">${item.ext}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            return `
                <div class="fixed inset-0 z-[200] bg-white flex flex-col animate-slide-up">
                    <div class="p-6 flex items-center justify-between border-b border-slate-100 bg-white sticky top-0 z-[210]">
                        <div class="flex items-center space-x-4">
                            <button onclick="setDetailModal(null)" class="p-2 -ml-2 rounded-full active:bg-slate-50 transition-colors">
                                <i data-lucide="chevron-left" size="24" class="text-lodge-teal"></i>
                            </button>
                            <h2 class="text-xl font-bold text-slate-800">${title}</h2>
                        </div>
                        <button onclick="setDetailModal(null)" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${t.close}</button>
                    </div>
                    <div class="flex-1 overflow-y-auto p-6 bg-slate-50/50">
                        ${body}
                    </div>
                </div>
            `;
        }

        function render() {
            let html = '';
            switch (state.view) {
                case 'loading': html = renderLoading(); break;
                case 'language': html = renderLanguage(); break;
                case 'landing':  html = renderLanding(); break;
                case 'capture':  html = renderCapture(); break;
                case 'wifi':     html = renderWifi(); break;
                case 'portal':   html = renderPortal(); break;
                default:         html = renderLoading(); break;
            }
            appContainer.innerHTML = html;
            lucide.createIcons();
        }

        async function loadLiveActivities() {
            try {
                const res = await fetch('/api/activities', { cache: 'no-store' });
                if (!res.ok) throw new Error('activities API responded ' + res.status);
                const data = await res.json();
                if (!data.activities || !data.activities.length) throw new Error('empty activities payload');
                LIVE_ACTIVITIES = data.activities;
                state.activeLiveTab = LIVE_ACTIVITIES[0].category || 'cruises';
            } catch (err) {
                // Silent by design: this is expected whenever the app is
                // previewed outside of Vercel (no /api routes available), or
                // if Heritage's site is briefly unreachable. The curated
                // activities in config.json cover this automatically.
                console.warn('Live activities unavailable, using config.json fallback:', err.message);
                liveActivitiesError = true;
            }
            render();
        }

        async function loadConfig() {
            try {
                const res = await fetch('./config.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('config.json not reachable');
                CONFIG = await res.json();
            } catch (err) {
                console.warn('Falling back to built-in content:', err.message);
                CONFIG = DEFAULT_CONFIG;
                configError = true;
            }
            state.view = 'language';
            render();
            loadLiveActivities();
        }

        window.onload = loadConfig;
    </script>
</body>
</html>
